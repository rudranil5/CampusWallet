<script>

window.onload = function(){

    let status='';
    let status2='';
    let serviceProvider='canteen';
    fetch ('/statusGet?service=canteen')
    .then(res=>res.json())
    .then(data=>{
        data.forEach(item=>{
            console.log(data);
        if (item.status=='closed'){
            status= 'Closed';
            status2='🔴';
            document.getElementById('studentTable').innerHTML=("<HR color='black'><BR><h1 align='center' >CANTEEN<BR>IS<BR>NOW<BR>CLOSED</h1><br><HR height='10px'>");
        }
        else if (item.status=='open'){
            status='Open';
            status2='🟢';
            show_Menu();
        }
        else{
            console.log("Some Error Occured");
            console.log(item.status);
            alert("Server Error");
            
        }
        })
        document.getElementById('canteen-status').innerHTML=(`${status2} <b>${status}</b>`);
        showOrder(); //not working
        
        
    })
        .catch(err=>console.log(err));
    
};

window.show_Menu =function(){
fetch("/showMenu")
.then(res => res.json())
.then(data => {

const tableBody = document.querySelector("#studentTable tbody");
tableBody.innerHTML = "";

data.forEach(item => {

const row = document.createElement("tr");

const tdItem = document.createElement("td");
tdItem.textContent = item.items;

const tdCost = document.createElement("td");
tdCost.textContent = item.price;

const tdQty = document.createElement("td");
const qtyInput = document.createElement("input");
qtyInput.type = "number";
qtyInput.min = "1";
qtyInput.id = `qty-${item.items}`;
tdQty.appendChild(qtyInput);

const tdTime = document.createElement("td");
const timeInput = document.createElement("input");
timeInput.type = "text";
timeInput.placeholder = "1:00 PM";
tdTime.appendChild(timeInput);

const tdBtn = document.createElement("td");
const orderBtn = document.createElement("button");
orderBtn.textContent = "ORDER";

orderBtn.addEventListener("click", ()=>{
orderItem(item.items, item.price, `qty-${item.items}`);
});

tdBtn.appendChild(orderBtn);

row.appendChild(tdItem);
row.appendChild(tdCost);
row.appendChild(tdQty);
row.appendChild(tdTime);
row.appendChild(tdBtn);

tableBody.appendChild(row);

});

})
.catch(err => console.log("Fetch error:",err));

};


function orderItem(menu_item, menu_cost, menu_id){
    fetch ('/statusGet?service=canteen')
.then(res=>res.json())
.then(data=>{
    status=data[0].status;
    if (status=='closed'){
        alert("Sorry,Canteen is now Closed , Please try again later");

    }
    else {
        console.log("Selected:"+menu_id);
        const randomString = Math.random().toString(36).substring(2, 10);
        console.log(randomString); 
        let quant = document.getElementById(menu_id).value;
        let Uid = JSON.parse(sessionStorage.getItem("object"));
        if (!Uid){
            window.location.href="login.html";
        }
        const data = {
        uid:Uid,
        menuitem: menu_item,
        cost: menu_cost,
        quantity: quant,
        code:randomString
        };
        console.log(data);

        fetch("/saveCode",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({data})
        })
        .then(res=>res.json())
        .then(data_back=>{
        console.log(data_back.message);
        alert("Order Sent ✅");
        })
        .catch(err=>console.log("Order error:",err));
    }
})


}
window.showOrder= function(){
    let Userid=JSON.parse(sessionStorage.getItem("object"))
    fetch (`/showOrderStatus?Uid=${Userid}`)
    .then(res=>res.json())
    .then (data=>{
        console.log("Got order Updates"+{data});

        const tableBody = document.querySelector("#showstatus tbody");
        tableBody.innerHTML = "";

data.forEach(order => {

const row = document.createElement("tr");

const tdItem = document.createElement("td");
tdItem.textContent = order.item;

const tdCost = document.createElement("td");
tdCost.textContent = order.cost;

const tdQty = document.createElement("td");
tdQty.textContent= order.quantity;

const tdTime = document.createElement("td");
tdTime.textContent= order.time;

const tdStatus = document.createElement("td");
tdStatus.textContent= order.status;

const tdCode = document.createElement("td");
tdCode.textContent= order.code;

const tdAmount = document.createElement("td");
tdAmount.textContent= order.totalAmount;


const tdBtn = document.createElement("td");
const PayBtn = document.createElement("button");
PayBtn.textContent = "Pay Now";

PayBtn.addEventListener("click", ()=>{});

tdBtn.appendChild(PayBtn);

row.appendChild(tdItem);
row.appendChild(tdCost);
row.appendChild(tdQty);
row.appendChild(tdTime);
row.appendChild(tdStatus);
row.appendChild(tdCode);
row.appendChild(tdAmount);
row.appendChild(tdBtn);

tableBody.appendChild(row);

});

    })
}


</script>
